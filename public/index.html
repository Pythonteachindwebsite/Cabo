<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CABO 纸牌游戏</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <img src="/IMG_0872.jpeg" alt="Logo" class="logo">
            <h1>CABO</h1>
        </header>

        <!-- 房间/游戏状态区 -->
        <div id="roomSection" class="section">
            <h2>加入游戏</h2>
            <div class="form-group">
                <input type="text" id="playerName" placeholder="输入你的名字" maxlength="20">
            </div>
            <div class="form-group">
                <input type="text" id="roomCode" placeholder="输入房间号" maxlength="10">
            </div>
            <div class="button-row">
                <button id="createRoomBtn" class="btn btn-primary">创建房间</button>
                <button id="joinRoomBtn" class="btn btn-primary">加入房间</button>
            </div>
            <p id="roomInfo" class="info-text"></p>
        </div>

        <!-- 游戏区域 -->
        <div id="gameSection" class="section" style="display: none;">
            <!-- 游戏头部信息 -->
            <div class="game-header">
                <div class="info-row">
                    <span><strong>房间号:</strong> <span id="displayRoomCode">-</span></span>
                    <span><strong>你的名字:</strong> <span id="displayPlayerName">-</span></span>
                    <span><strong>轮次:</strong> <span id="roundDisplay">1/3</span></span>
                </div>
                <button id="leaveGameBtn" class="btn btn-secondary">离开游戏</button>
            </div>

            <!-- 游戏状态提示 -->
            <div id="gameStatus" class="status-box"></div>

            <!-- 对手玩家区域 -->
            <div class="opponents-section">
                <h3>其他玩家</h3>
                <div id="opponentsList" class="opponents-grid"></div>
            </div>

            <!-- 牌堆区域 -->
            <div class="deck-section">
                <div class="deck-box">
                    <h3>牌堆</h3>
                    <div id="drawPile" class="card-pile"></div>
                    <p id="drawPileCount" class="pile-info">剩余: 0</p>
                </div>

                <div class="deck-box">
                    <h3>弃牌堆</h3>
                    <div id="discardPile" class="card-pile"></div>
                </div>

                <div id="drawnCardBox" class="deck-box" style="display: none;">
                    <h3>已抽卡</h3>
                    <div id="drawnCard" class="card card-drawn"></div>
                    <p class="action-hint">点击手牌交换 或 点击弃牌堆丢弃</p>
                </div>
            </div>

            <!-- 玩家手牌 -->
            <div class="hand-section">
                <h3>你的手牌</h3>
                <div id="playerHand" class="player-hand"></div>
            </div>

            <!-- 游戏控制按钮 -->
            <div class="controls-section">
                <button id="drawCardBtn" class="btn btn-action btn-large">抽卡</button>
                <button id="callCaboBtn" class="btn btn-warning btn-large">喊 CABO</button>
            </div>
        </div>
    </div>

    <!-- 轮次结束模态 -->
    <div id="roundEndModal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2>轮次结束</h2>
            <div id="roundResultsTable" class="results-table"></div>
            <button id="nextRoundBtn" class="btn btn-primary btn-large">下一轮</button>
        </div>
    </div>

    <!-- 游戏结束模态 -->
    <div id="gameEndModal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2>游戏结束</h2>
            <div id="finalResultsTable" class="results-table"></div>
            <button id="backToRoomBtn" class="btn btn-primary btn-large">返回房间</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
