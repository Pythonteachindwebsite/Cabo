<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CABO 遊戲</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 加入房間畫面 -->
  <div id="joinScreen" class="screen">
    <div class="container">
      <h1>CABO 遊戲</h1>
      <input type="text" id="playerName" placeholder="輸入玩家名稱" />
      <div class="buttonGroup">
        <button id="createRoom" class="btn btn-primary">創建房間</button>
        <button id="joinRoom" class="btn btn-secondary">加入房間</button>
      </div>
      <input type="text" id="roomId" placeholder="輸入房間代碼" style="display: none;" />
      <div id="joinRoomInput" style="display: none;">
        <input type="text" id="roomId" placeholder="輸入房間代碼" />
      </div>
    </div>
  </div>

  <!-- 遊戲畫面 -->
  <div id="gameScreen" class="screen" style="display: none;">
    <div class="container">
      <h1 id="roomCode">房間代碼: </h1>
      <h3>玩家列表:</h3>
      <ul id="playerList"></ul>
      <button id="startGame" class="btn btn-primary">開始遊戲</button>
      <button id="leaveRoom" class="btn btn-danger">離開房間</button>

      <div id="gameArea" style="display: none;">
        <div id="currentPlayer"></div>
        <div id="discardPile" class="discardPile"></div>
        <button id="drawCard" class="btn btn-primary">抽牌</button>
        <button onclick="callCable()" class="btn btn-warning">呼喚 CABLE</button>
        <div id="handsDisplay"></div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/game.js"></script>
</body>
</html>
