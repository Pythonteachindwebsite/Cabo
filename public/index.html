<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CABO 紙牌遊戲</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="mainScreen" class="screen">
    <div class="container">
      <h1>CABO</h1>
      <div class="button-group">
        <input type="text" id="playerName" placeholder="輸入你的名字" maxlength="20">
        <button onclick="createRoom()">建立房間</button>
        <button onclick="showJoinRoom()">加入房間</button>
      </div>
    </div>
  </div>

  <div id="joinRoomScreen" class="screen" style="display:none;">
    <div class="container">
      <h2>加入房間</h2>
      <div class="button-group">
        <input type="text" id="joinPlayerName" placeholder="輸入你的名字" maxlength="20">
        <input type="text" id="roomCodeInput" placeholder="輸入房間代碼" maxlength="6">
        <button onclick="joinRoom()">確認加入</button>
        <button onclick="backToMain()">返回</button>
      </div>
    </div>
  </div>

  <div id="lobbyScreen" class="screen" style="display:none;">
    <div class="container">
      <h2>房間代碼: <span id="roomCode"></span></h2>
      <h3>玩家列表</h3>
      <div id="playerList"></div>
      <button id="startBtn" onclick="startGame()" style="display:none;">開始遊戲</button>
      <button onclick="leaveRoom()">離開房間</button>
    </div>
  </div>

  <div id="gameScreen" class="screen" style="display:none;">
    <div class="container">
      <h2 id="currentTurn">當前玩家：</h2>
      <div id="handDisplay" class="hand-display"></div>
      <div class="button-group">
        <button onclick="drawCard()">抽卡</button>
        <button onclick="callCabo()">喊 CABO</button>
        <button onclick="leaveRoom()">離開房間</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
