<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CABO Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 加入房間 -->
  <div id="joinMenu" class="screen active">
    <h1>😍 CABO</h1>
    <input type="text" id="playerName" placeholder="輸入玩家名稱">
    <button id="createRoomBtn">創建房間</button>
    <input type="text" id="roomId" placeholder="輸入房間代碼">
    <button id="joinRoomBtn">加入房間</button>
  </div>

  <!-- 房間等待 -->
  <div id="gameMenu" class="screen">
    <h2>房間等待中</h2>
    <div id="playersList"></div>
    <button id="startGameBtn" style="display: none;">開始遊戲</button>
    <button id="leaveBtn">退串</button>
  </div>

  <!-- 遊戲中 -->
  <div id="gameBoard" class="screen">
    <h2>CABO 遊戲中</h2>
    <div id="gameInfo"></div>
    <div id="gameLog" style="height: 200px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; margin: 10px 0;"></div>
    <div id="handDisplay"></div>
    <button id="drawBtn" onclick="socket.emit('drawCard')">抽牌</button>
    <button id="caboBtn" onclick="socket.emit('callCabo')" style="background: red; color: white;">宣布 CABO</button>
    <button id="leaveBtn">退串</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
