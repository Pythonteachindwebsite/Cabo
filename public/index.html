<!-- public/index.html -->
<!DOCTYPE html>
<html>
<head>
  <title>CABO</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1><img src="/IMG_0872.jpeg" alt=""> CABO</h1>

    <div id="joinSection">
      <input type="text" id="playerNameInput" placeholder="Your name">
      <input type="text" id="roomCodeInput" placeholder="Room code (to join)">
      <button onclick="createRoom()">Create Room</button>
      <button onclick="joinRoom()">Join Room</button>
    </div>

    <div id="roomPanel" style="display:none;">
      <h2>Room Code: <span id="roomCode"></span></h2>
      <div id="playerList"></div>
      <button id="startGameBtn" onclick="startGame()" disabled>Start Game</button>
    </div>

    <div id="gamePanel" style="display:none;">
      <div id="handContainer"></div>
      <div id="discardPile"></div>
      <div id="deckRemaining"></div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
