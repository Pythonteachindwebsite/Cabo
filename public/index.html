<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CABO Card Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="menu" class="screen">
    <h1>CABO</h1>
    <input type="text" id="playerName" placeholder="Your Name">
    <input type="text" id="roomCode" placeholder="Room Code (optional)">
    <button id="createRoomBtn">Create/Join Room</button>
  </div>

  <div id="waitingRoom" class="screen" style="display:none;">
    <h2>Waiting Room</h2>
    <div id="playerList"></div>
    <p>Players: <span id="playerCount">0/4</span></p>
    <button id="startGameBtn">Start Game</button>
  </div>

  <div id="game" class="screen" style="display:none;">
    <h2>CABO Game</h2>
    <p>Current Player: <span id="currentPlayer"></span></p>
    <p>Discard Pile Top: <span id="discardTop"></span></p>
    <p>Drawn Card: <span id="drawnCard" style="display:none;"></span></p>
    
    <h3>My Hand</h3>
    <div id="myHand" class="hand"></div>

    <button id="confirmBtn">Confirm Cards</button>

    <div id="gameControls" style="display:none;">
      <button id="drawBtn">Draw Card</button>
      <button id="discardBtn">Discard</button>
      <button id="callCABOBtn">Call CABO</button>
      <button id="game.js"></script>
</body>
</html>
