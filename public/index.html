<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CABO Card Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="mainMenu" class="screen">
    <div class="menu-card">
      <h1>CABO</h1>
      
      <div class="menu-section">
        <h2>创建房间</h2>
        <input type="text" id="playerNameInput" placeholder="输入你的名字">
        <button onclick="createRoom()">创建</button>
      </div>

      <div class="menu-section">
        <h2>加入房间</h2>
        <input type="text" id="roomCodeInput" placeholder="房间代码">
        <input type="text" id="playerNameInput2" placeholder="输入你的名字">
        <button onclick="joinRoom()">加入</button>
      </div>
    </div>
  </div>

  <div id="waitingScreen" class="screen" style="display: none;">
    <div class="menu-card">
      <h1>等待游戏开始</h1>
      <div id="roomCodeDisplay" class="room-code"></div>
      <div id="playerList"></div>
    </div>
  </div>

  <div id="gameBoard" class="screen" style="display: none;"></div>

  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
