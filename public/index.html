<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CABO Card Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Main Menu -->
  <div id="mainMenu" class="screen">
    <h1>CABO</h1>
    <p>線上卡牌遊戲</p>
    <input id="playerName" type="text" placeholder="輸入你的名字" maxlength="15">
    <button id="createBtn">建立房間</button>
    <button id="joinBtn">加入房間</button>
  </div>

  <!-- Join Menu -->
  <div id="joinMenu" class="screen hidden">
    <h2>加入房間</h2>
    <input id="roomCode" type="text" placeholder="房間代碼" maxlength="6" style="text-transform: uppercase;">
    <button id="joinRoomBtn">加入</button>
    <button id="backBtn">返回</button>
  </div>

  <!-- Lobby -->
  <div id="lobby" class="screen hidden">
    <h2>房間: <span id="roomDisplay"></span></h2>
    <div id="playerList"></div>
    <button id="startBtn" disabled>開始遊戲（需2人以上）</button>
    <button id="leaveLobbyBtn">離開房間</button>
  </div>

  <!-- Game Screen -->
  <div id="gameScreen" class="screen hidden">
    <div id="gameHeader">
      <h2>第 <span id="roundNum">1</span> 輪</h2>
      <p>房間: <span id="gameRoomCode"></span></p>
    </div>

    <div id="currentPlayerInfo">
      <p>現在輪到: <strong id="currentPlayerName"></strong></p>
    </div>

    <div id="myHandArea">
      <p>我的手牌:</p>
      <div id="myHand"></div>
    </div>

    <div id="discardArea">
      <p>棄牌堆: <span id="discardCard"></span></p>
    </div>

    <div id="drawnCardArea" class="hidden">
      <p>抽到的卡: <span id="drawnCard"></span></p>
    </div>

    <div id="gameActions"></div>

    <div id="scoreBoard" class="hidden">
      <h3>分數</h3>
      <div id="scores"></div>
    </div>

    <button id="callCaboBtn" class="hidden">呼叫CABO</button>
  </div>

  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
