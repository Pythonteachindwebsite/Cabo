<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CABO 紙牌遊戲</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="mainMenu" class="container">
    <h1>CABO 紙牌遊戲</h1>
    <input type="text" id="playerName" placeholder="輸入你的名字" maxlength="20">
    <button onclick="createRoom()">建立房間</button>
    <button onclick="showJoinRoom()">加入房間</button>
  </div>

  <div id="joinRoomMenu" class="container hidden">
    <h1>加入房間</h1>
    <input type="text" id="roomCode" placeholder="房間代碼">
    <input type="text" id="playerNameJoin" placeholder="你的名字">
    <button onclick="joinRoom()">加入</button>
    <button onclick="backToMenu()">返回</button>
  </div>

  <div id="waitingRoom" class="container hidden">
    <h1>房間: <span id="roomCodeDisplay"></span></h1>
    <div id="playerList"></div>
    <button id="startButton" onclick="startGame()" disabled>開始遊戲</button>
    <button onclick="leaveRoom()">離開</button>
  </div>

  <div id="gameScreen" class="container hidden">
    <div class="info-bar">
      <span>回合 <span id="roundNumber">1</span></span>
      <span>輪到: <span id="currentPlayer"></span></span>
      <span>牌堆剩: <span id="deckCount">0</span></span>
    </div>

    <div class="discard-area">
      <div>棄牌堆頂: <span id="discardTop">-</span></div>
    </div>

    <div class="action-buttons">
      <button id="drawButton" onclick="drawFromDeck()">從牌堆抽牌</button>
      <button id="discardButton" onclick="discardCard()" disabled>棄掉抽到的牌</button>
    </div>

    <div class="my-cards">
      <h3>我的牌</h3>
      <div id="cardGrid" class="card-grid"></div>
    </div>

    <div class="action-buttons">
      <button id="endTurnButton" onclick="endTurn()">結束回合</button>
      <button onclick="leaveRoom()">離開遊戲</button>
    </div>
  </div>

  <script src="socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
