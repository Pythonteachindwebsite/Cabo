<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabo 遊戲</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .game-status {
            background: #f0f0f0;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .status-text {
            font-size: 1.1em;
            color: #333;
            margin: 10px 0;
        }

        .current-player {
            font-size: 1.3em;
            font-weight: bold;
            color: #667eea;
        }

        .join-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover {
            background: #764ba2;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .players-list {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .players-list h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .player-item {
            padding: 8px;
            margin: 5px 0;
            background: white;
            border-left: 4px solid #667eea;
            border-radius: 3px;
        }

        .game-board {
            background: #2d5016;
            border-radius: 10px;
            padding: 20px;
            color: white;
            display: none;
        }

        .game-board.active {
            display: block;
        }

        .discard-pile {
            text-align: center;
            margin: 20px 0;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .card {
            display: inline-block;
            width: 80px;
            height: 120px;
            background: white;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            color: #333;
            font-weight: bold;
            font-size: 1.2em;
        }

        .card.red {
            color: red;
        }

        .card.black {
            color: black;
        }

        .hand {
            margin-top: 20px;
            text-align: center;
        }

        .hand-cards {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
        }

        .action-buttons button {
            flex: 1;
            max-width: 150px;
        }

        .message {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
            border-left: 4px solid #2196f3;
            color: #1565c0;
        }

        .message.success {
            background: #e8f5e9;
            border-left-color: #4caf50;
            color: #2e7d32;
        }

        .message.error {
            background: #ffebee;
            border-left-color: #f44336;
            color: #c62828;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎴 Cabo</h1>
        <p class="subtitle">多人線上紙牌遊戲</p>

        <div id="joinSection" class="join-section">
            <input type="text" id="playerName" placeholder="輸入你的名字..." maxlength="20">
            <button onclick="joinGame()">加入遊戲</button>
        </div>

        <div id="gameStatus" class="game-status" style="display:none;">
            <div class="status-text">遊戲房間: <span id="gameRoomId">-</span></div>
            <div class="status-text">玩家人數: <span id="playerCount">0</span>/4</div>
            <div class="status-text current-player">當前玩家: <span id="currentPlayer">等待中...</span></div>
        </div>

        <div id="playersList" class="players-list" style="display:none;">
            <h3>玩家列表</h3>
            <div id="playersListContent"></div>
        </div>

        <div id="messageBox"></div>

        <div id="gameBoard" class="game-board">
            <div class="discard-pile">
                <p>棄牌堆</p>
                <div id="discardCard" class="card">?</div>
            </div>

            <div class="hand">
                <p>你的牌</p>
                <div class="hand-cards" id="playerHand"></div>
            </div>

            <div class="action-buttons">
                <button onclick="drawCard()">抽牌</button>
                <button onclick="declareCabo()">宣佈 CABO</button>
            </div>
        </div>

        <div id="loadingBox" class="loading" style="display:none;">
            正在連接遊戲伺服器...
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        let socket;
        let gameId;
        let playerId;
        let playerHand = [];
        let isPlayerTurn = false;

        function showMessage(text, type = 'info') {
            const messageBox = document.getElementById('messageBox');
            const message = document.createElement('div');
            message.className = `message ${type}`;
            message.textContent = text;
            messageBox.appendChild(message);
            
            setTimeout(() => message.remove(), 5000);
        }

        function joinGame() {
            const playerName = document.getElementById('playerName').value.trim();
            
            if (!playerName) {
                showMessage('請輸入你的名字', 'error');
                return;
            }

            // 生成遊戲房間 ID
            gameId = 'game_' + Math.random().toString(36).substr(2, 9);
            
            // 連接 Socket.IO
            socket = io();

            socket.on('connect', () => {
                console.log('已連接到伺服器');
                socket.emit('joinGame', {
                    gameId: gameId,
                    playerName: playerName
                });
            });

            socket.on('playerJoined', (data) => {
                showMessage(data.message, 'success');
                updatePlayersList(data.players);
                document.getElementById('gameStatus').style.display = 'block';
                document.getElementById('gameRoomId').textContent = gameId;
                document.getElementById('playerCount').textContent = data.players.length;
            });

            socket.on('gameStarted', (data) => {
                showMessage('遊戲開始！', 'success');
                document.getElementById('gameBoard').classList.add('active');
                updateCurrentPlayer(data.currentPlayer);
                updatePlayersList(data.players);
            });

            socket.on('gameUpdate', (data) => {
                updateCurrentPlayer(data.currentPlayer);
                updateDiscardCard(data.discardPile);
                updatePlayersList(data.players);
            });

            socket.on('updateHand', (data) => {
                playerHand = data.hand;
                renderHand(data.hand);
            });

            socket.on('caboDeclared', (data) => {
                showMessage(`${data.playerName} 宣佈了 CABO！`, 'success');
            });

            socket.on('error', (message) => {
                showMessage(message, 'error');
            });

            socket.on('disconnect', () => {
                showMessage('已斷開連接', 'error');
            });

            document.getElementById('joinSection').style.display = 'none';
            document.getElementById('loadingBox').style.display = 'block';
        }

        function updatePlayersList(players) {
            const content = document.getElementById('playersListContent');
            content.innerHTML = players.map(p => 
                `<div class="player-item">${p.name}</div>`
            ).join('');
            document.getElementById('playersList').style.display = 'block';
        }

        function updateCurrentPlayer(name) {
            document.getElementById('currentPlayer').textContent = name;
            document.getElementById('loadingBox').style.display = 'none';
        }

        function updateDiscardCard(card) {
            if (card) {
                const color = (card.suit === '♥' || card.suit === '♦') ? 'red' : 'black';
                document.getElementById('discardCard').innerHTML = 
                    `<span class="${color}">${card.rank}${card.suit}</span>`;
            }
        }

        function renderHand(hand) {
            const handDiv = document.getElementById('playerHand');
            handDiv.innerHTML = hand.map((card, index) => 
                `<div class="card" onclick="selectCard(${index})">
                    <span class="${(card.suit === '♥' || card.suit === '♦') ? 'red' : 'black'}">
                        ${card.rank}${card.suit}
                    </span>
                </div>`
            ).join('');
        }

        function selectCard(index) {
            if (socket) {
                socket.emit('playCard', {
                    cardIndex: index,
                    position: null
                });
            }
        }

        function drawCard() {
            showMessage('從牌堆抽牌', 'info');
        }

        function declareCabo() {
            if (socket) {
                socket.emit('declareCabo');
            }
        }
    </script>
</body>
</html>
