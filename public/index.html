<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CABO</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Setup Screen -->
  <div id="setupScreen" class="screen active">
    <div class="container">
      <h1>CABO</h1>
      
      <div class="tab-buttons">
        <button class="tab-btn active" onclick="switchTab('create')">Create Room</button>
        <button class="tab-btn" onclick="switchTab('join')">Join Room</button>
      </div>

      <div id="createTab" class="tab-content active">
        <input id="playerNameInput" type="text" placeholder="Your name" />
        <button onclick="createRoom()">Create Room</button>
      </div>

      <div id="joinTab" class="tab-content">
        <input id="roomCodeInput" type="text" placeholder="Room code" />
        <input id="playerNameInput2" type="text" placeholder="Your name" />
        <button onclick="joinRoom()">Join Room</button>
      </div>
    </div>
  </div>

  <!-- Lobby Screen -->
  <div id="lobbyScreen" class="screen">
    <div class="container">
      <h2>Room: <span id="roomCode"></span></h2>
      <h3>Players:</h3>
      <ul id="playerList"></ul>
      <button onclick="startGame()" class="start-btn">Start Game</button>
    </div>
  </div>

  <!-- Game Screen -->
  <div id="gameScreen" class="screen">
    <div class="top-section">
      <div class="info-box">
        <p>Current Player: <strong id="currentPlayer"></strong></p>
      </div>
      <div class="info-box">
        <p>Discard Pile Top: <span id="discardTop">-</span></p>
      </div>
    </div>

    <div id="drawnCard" class="drawn-card" style="display:none;">
      <p>Your Drawn Card:</p>
      <div id="drawnCardDisplay" class="card"></div>
    </div>

    <div id="handsContainer" class="hands-container"></div>

    <div class="actions">
      <button onclick="drawCard()">Draw Card</button>
      <button onclick="discardDrawn()">Discard</button>
      <button onclick="endTurn()">End Turn</button>
      <button onclick="callCabo()">Call CABO</button>
    </div>

    <div id="gameLog" class="game-log"></div>
  </div>

  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script src="game.js"></script>
  
  <script>
    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tab + 'Tab').classList.add('active');
      document.querySelector(`button[onclick="switchTab('${tab}')"]`).classList.add('active');
    }
  </script>
</body>
</html>
